<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#466EA0">
<meta name="color-scheme" content="light only">
<title>Giro Postino</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="aggiorna" hidden><button data-a="aggiorna">Nuova versione disponibile – tocca per aggiornare</button></div>
<main id="app"></main>
<section id="mappa" hidden>
  <div class="barra m-su"><button class="neutro" data-a="indietro">‹ Indietro</button><div class="titolo-pag">Mappa</div><button class="neutro" data-a="m-legenda" aria-label="Legenda">?</button><button class="neutro" data-a="m-gps">📍 Dove sono</button></div>
  <div class="m-corpo"><div id="m-carta"></div><button class="neutro m-tutto" data-a="m-tutto">⤢ Tutto il giro</button><div id="m-legenda" hidden></div></div>
  <div id="m-scheda"></div>
</section>
<section id="archivio" hidden>
  <div class="a-su">
    <div class="barra"><button class="neutro" data-a="a-esci">‹ Esci</button><div class="titolo-pag" id="a-tit">Archivio</div></div>
    <input id="aq" class="campo a-q" type="search" placeholder="Cerca cognome, N, codice o via" autocomplete="off" autocapitalize="characters" enterkeyhint="search">
    <div class="a-giorni" id="a-giorni"></div>
  </div>
  <div class="a-corpo"><div id="a-carta"></div>
    <div class="a-modo"><button data-a="a-modo" data-m="giorno">Giorni</button><button data-a="a-modo" data-m="esito">Esiti</button></div>
    <button class="neutro m-tutto" data-a="a-tutto">⤢ Tutto</button>
  </div>
  <div id="a-scheda"></div>
</section>
<div id="sopra"></div>
<div id="toast"></div>
<input type="file" id="file" hidden>
<script src="app.js"></script>
</body>
</html>
